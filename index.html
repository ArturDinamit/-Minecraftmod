<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Mods</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 10%, rgba(0,255,120,.13), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(0,180,255,.12), transparent 30%),
                #070909;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px;
            background: #101413;
            text-align: center;
            border-bottom: 1px solid #26342b;
        }

        .logo {
            font-size: 27px;
            font-weight: 900;
        }

        .logo span {
            color: #42e66c;
        }

        .hero {
            padding: 45px 20px 30px;
            text-align: center;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(35px, 9vw, 65px);
            background: linear-gradient(135deg, #fff, #8cffaa, #35e96c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero p {
            color: #929a96;
        }

        .container {
            width: min(900px, calc(100% - 30px));
            margin: auto;
        }

        .mod-card {
            overflow: hidden;
            border-radius: 26px;
            background: #161b19;
            border: 1px solid #29352d;
            box-shadow: 0 25px 80px rgba(0,0,0,.45);
        }

        .mod-image {
            display: block;
            width: 100%;
            height: 330px;
            object-fit: cover;
        }

        .mod-info {
            padding: 22px;
        }

        .mod-info h2 {
            margin-top: 0;
        }

        .mod-info p {
            color: #929a96;
            line-height: 1.6;
        }

        .download {
            display: block;
            margin-top: 22px;
            padding: 18px;
            border-radius: 17px;
            background: linear-gradient(135deg, #36dc65, #20b94d);
            color: #061009;
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: 900;
        }

        .download:hover {
            background: #55ee79;
        }

        footer {
            padding: 40px 20px;
            color: #626a66;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                width: calc(100% - 20px);
            }

            .mod-image {
                height: 250px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        Minecraft <span>Mods</span>
    </div>
</header>

<section class="hero">
    <h1>Моды Minecraft</h1>
    <p>Скачивай моды для Minecraft Bedrock</p>
</section>

<main class="container">
    <div class="mod-card">

        <img
            class="mod-image"
            src="https://raw.githubusercontent.com/ArturDinamit/-Minecraftmod/main/5002.jpg"
            alt="Несбалансированная Кузница"
        >

        <div class="mod-info">
            <h2>Несбалансированная Кузница</h2>

            <p>
                Незеритовая экипировка с максимальными чарами
                всего за один изумруд.
            </p>

            <p>
                Оригинальное название: OP Toolsmith<br>
                Версия: Minecraft Bedrock<br>
                Тип: Addon
            </p>

            <a
                class="download"
                href="https://raw.githubusercontent.com/ArturDinamit/-Minecraftmod/main/mod.mcaddon"
                download="mod.mcaddon"
            >
                ↓ Скачать мод
            </a>
        </div>

    </div>
</main>

<footer>
    Minecraft Mods • Bedrock Edition
</footer>

</body>
</html>
