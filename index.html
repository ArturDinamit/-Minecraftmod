
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Mods</title>

  <style>
    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 90px;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(0,255,120,0.14), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(0,180,255,0.14), transparent 30%),
        #070909;
    }

    body.lock {
      overflow: hidden;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 18px;
      text-align: center;
      background: rgba(8,10,10,0.85);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .logo span {
      color: #42e66c;
    }

    .hero {
      padding: 45px 20px 20px;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(35px, 9vw, 65px);
      line-height: 1;
      background: linear-gradient(135deg, #fff, #8cffaa, #35e96c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(95,255,146,0.22);
      animation: glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        filter: drop-shadow(0 0 8px rgba(66,230,108,0.2));
      }
      to {
        filter: drop-shadow(0 0 18px rgba(66,230,108,0.4));
      }
    }

    .hero p {
      max-width: 700px;
      margin: 18px auto 0;
      color: #929a96;
      line-height: 1.6;
      font-size: 15px;
    }

    .search-wrap {
      width: min(1100px, calc(100% - 30px));
      margin: 0 auto 18px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 16px 18px 16px 48px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      outline: none;
      background: rgba(12,15,15,0.7);
      color: #fff;
      font-size: 16px;
      box-shadow: 0 0 0 rgba(0,0,0,0);
      transition: 0.2s ease;
    }

    .search-input:focus {
      border-color: rgba(66,230,108,0.6);
      box-shadow: 0 0 0 3px rgba(66,230,108,0.12);
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      color: #8cffaa;
      pointer-events: none;
    }

    .categories {
      width: min(1100px, calc(100% - 30px));
      margin: 0 auto 25px;
      padding: 10px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      background: rgba(8,10,10,0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .category {
      flex: 0 0 auto;
      border: 0;
      border-radius: 11px;
      padding: 11px 17px;
      background: transparent;
      color: #aebbb2;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s ease;
    }

    .category:hover,
    .category.active {
      background: rgba(66,230,108,0.16);
      color: #7cff99;
      transform: translateY(-1px);
    }

    .container {
      width: min(900px, calc(100% - 30px));
      margin: auto;
    }

    .mods {
      display: grid;
      gap: 25px;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 26px;
      background: rgba(22,27,25,0.92);
      box-shadow: 0 25px 80px rgba(0,0,0,0.45);
      cursor: pointer;
      transition: 0.3s ease;
      transform: translateY(18px);
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card:hover {
      transform: translateY(-7px) scale(1.004);
      border-color: rgba(65,235,108,0.45);
      box-shadow: 0 30px 90px rgba(0,0,0,0.55);
    }

    .image {
      position: relative;
      height: 300px;
      overflow: hidden;
    }

    .image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .image img {
      transform: scale(1.08);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(5,8,7,0.92), transparent 55%);
      pointer-events: none;
    }

    .badge {
      position: absolute;
      top: 18px;
      left: 18px;
      padding: 8px 13px;
      border-radius: 999px;
      background: rgba(20,25,22,0.85);
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 13px;
      font-weight: bold;
      animation: pulse 2.1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 rgba(66, 230, 108, 0);
      }
      50% {
        box-shadow: 0 0 18px rgba(66, 230, 108, 0.28);
      }
    }

    .info {
      padding: 22px;
    }

    .info h2 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .info p {
      margin: 0;
      color: #929a96;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
    }

    .open {
      color: #55ee79;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .open:hover {
      color: #9cffa7;
    }

    .save {
      border: 1px solid rgba(66,230,108,0.4);
      border-radius: 12px;
      padding: 10px 14px;
      background: rgba(66,230,108,0.1);
      color: #8cffaa;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .save:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .save.saved {
      background: #42e66c;
      color: #071009;
    }

    .empty {
      padding: 40px 20px;
      border: 1px dashed rgba(255,255,255,0.18);
      border-radius: 20px;
      color: #929a96;
      text-align: center;
      line-height: 1.7;
      animation: fadeUp 0.4s ease;
    }

    .footer {
      padding: 30px 20px;
      color: #4f5753;
      text-align: center;
      font-size: 13px;
    }

    .bottom {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      height: 74px;
      padding: 9px 15px;
      border-top: 1px solid rgba(255,255,255,0.12);
      background: rgba(8,10,10,0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .bottom-inner {
      width: min(900px, 100%);
      height: 100%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tab {
      min-width: 140px;
      border: 0;
      border-radius: 14px;
      padding: 11px 18px;
      background: transparent;
      color: #aebbb2;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .tab:hover,
    .tab.active {
      background: rgba(66,230,108,0.15);
      color: #7cff99;
      transform: translateY(-1px);
    }

    .count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      margin-left: 5px;
      padding: 0 6px;
      border-radius: 999px;
      background: #42e66c;
      color: #071009;
      font-size: 11px;
      font-weight: 900;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      overflow-y: auto;
      padding: 20px 0 50px;
      background: rgba(4,6,6,0.98);
    }

    .modal.active {
      display: block;
    }

    .modal-content {
      width: min(850px, calc(100% - 30px));
      margin: auto;
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      margin-left: auto;
      border: 0;
      border-radius: 50%;
      background: #202523;
      color: #fff;
      font-size: 25px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .close:hover {
      background: #35d965;
      color: #071009;
    }

    .modal-image {
      display: block;
      width: 100%;
      max-height: 500px;
      margin-top: 15px;
      border-radius: 25px;
      object-fit: cover;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .description {
      padding: 25px 5px;
    }

    .description h2 {
      margin: 0 0 15px;
      font-size: clamp(30px, 7vw, 45px);
    }

    .description p {
      color: #aeb5b1;
      line-height: 1.7;
    }

    .title {
      margin: 25px 0 12px;
      font-size: 22px;
      font-weight: bold;
    }

    .items {
      display: grid;
      gap: 10px;
    }

    .item {
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      color: #d7ddd9;
      line-height: 1.5;
    }

    .info-box {
      margin-top: 25px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.05);
      line-height: 1.8;
    }

    .info-title {
      margin-bottom: 8px;
      color: #52e873;
      font-weight: bold;
    }

    .download {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 18px;
      border-radius: 17px;
      background: linear-gradient(135deg, #36dc65, #20b94d);
      color: #061009;
      text-align: center;
      text-decoration: none;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 12px 30px rgba(54,220,101,0.32);
      transition: 0.2s ease;
    }

    .download:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .note {
      margin-top: 12px;
      color: #626a66;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .image { height: 240px; }
      .container { width: calc(100% - 20px); }
      .actions { align-items: stretch; flex-direction: column; }
      .save { width: 100%; }
      .tab { min-width: 0; padding: 10px 12px; font-size: 13px; }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">Minecraft <span>Mods</span></div>
  </header>

  <section class="hero">
    <h1>Моды Minecraft</h1>
    <p>Выбирай категорию, ищи нужный мод и скачивай его прямо с сайта.</p>
  </section>

  <div class="search-wrap">
    <span class="search-icon">🔎</span>
    <input
      id="searchInput"
      class="search-input"
      type="text"
      placeholder="Поиск модов..."
      aria-label="Поиск модов"
    />
  </div>

  <div id="categories" class="categories">
    <button class="category active" data-category="all">Все</button>
    <button class="category" data-category="cars">Машины</button>
    <button class="category" data-category="furniture">Мебель</button>
    <button class="category" data-category="mobs">Мобы</button>
    <button class="category" data-category="weapons">Оружие</button>
    <button class="category" data-category="items">Предметы</button>
    <button class="category" data-category="features">Новые возможности</button>
    <button class="category" data-category="other">Другие</button>
  </div>

  <main class="container">
    <div id="modsList" class="mods"></div>
  </main>

  <footer class="footer">
    Minecraft Mods • Bedrock Edition
  </footer>

  <nav class="bottom">
    <div class="bottom-inner">
      <button id="modsTab" class="tab active" type="button">Моды</button>
      <button id="savedTab" class="tab" type="button">
        Сохраненные
        <span id="savedCount" class="count">0</span>
      </button>
    </div>
  </nav>

  <div id="detailsModal" class="modal">
    <div class="modal-content">
      <button class="close" data-close="detailsModal">×</button>

      <img id="detailsImage" class="modal-image" alt="">

      <div class="description">
        <h2 id="detailsTitle"></h2>
        <p id="detailsText"></p>

        <div id="detailsItems"></div>
        <div id="detailsInfo" class="info-box"></div>

        <a id="detailsDownload" class="download" href="#" download>
          ↓ Скачать мод
        </a>

        <div class="note">Файл для Minecraft Bedrock</div>
      </div>
    </div>
  </div>

  <div id="savedModal" class="modal">
    <div class="modal-content">
      <button class="close" data-close="savedModal">×</button>

      <div class="description">
        <h2>Сохраненные моды</h2>
        <p>Здесь находятся моды, которые ты сохранил.</p>

        <div id="savedList" class="mods"></div>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = "https://raw.githubusercontent.com/ArturDinamit/-Minecraftmod/main/";

    const mods = [
      {
        id: "forge",
        categories: ["mobs", "items", "features"],
        name: "Несбалансированная Кузница",
        image: BASE_URL + "5002.jpg",
        text: "Незеритовая экипировка с максимальными чарами всего за 1 изумруд.",
        items: [
          "Незеритовая броня и инструменты",
          "Новые сделки жителя-кузнеца",
          "Максимальные чары",
          "Удобный подбор для выживания"
        ],
        info: [
          "Оригинальное название: OP Toolsmith",
          "Версия: Minecraft Bedrock",
          "Тип: Addon"
        ],
        file: BASE_URL + "mod.mcaddon"
      },
      {
        id: "guns",
        categories: ["weapons", "items", "features"],
        name: "Современное оружие с разными стилями боя",
        image: BASE_URL + "102.jpg",
        text: "Современное и классическое огнестрельное оружие с разными характеристиками и боеприпасами.",
        items: [
          "Револьвер",
          "Пистолет",
          "Пистолет-пулемёт",
          "Двуствольный обрез",
          "Разные характеристики боя",
          "Разные типы боеприпасов"
        ],
        info: [
          "Название: TR’s Simple Guns",
          "Версия: Minecraft Bedrock",
          "Тип: Addon",
          "Боеприпасы: разные типы"
        ],
        file: BASE_URL + "guns.mcpack"
      },
      {
        id: "lada",
        categories: ["cars", "features"],
        name: "Лада Веста",
        image: BASE_URL + "Lada.jpg",
        text: "Собственная русская машина в Minecraft с открывающимися дверьми, капотом и багажником.",
        items: [
          "Доступны разные цвета, Такси и ДПС",
          "Открываются двери, капот и багажник",
          "4 посадочных места",
          "Заводится с ключа",
          "Есть коробка передач",
          "Спидометр",
          "Коллизия",
          "Требуется бензин",
          "Есть музыка"
        ],
        info: [
          "Название: Лада Веста",
          "Версия: Minecraft Bedrock",
          "Тип: Addon",
          "Стиль: Автомобиль / транспорт"
        ],
        file: BASE_URL + "Lada.mcaddon?download=1"
      },
      {
        id: "rustic_furniture",
        categories: ["furniture"],
        name: "Мебель в деревенском стиле",
        image: BASE_URL + "kurczak.jpg",
        text: "Мод Rustic Furniture добавит в игру большой набор мебели для обустройства дома. В коллекции появятся стулья, диваны, столы, шкафчики, ящики и многое другое.",
        items: [
          "Стулья и диваны — классические, современные и обеденные модели в 16 цветах",
          "Столы — журнальные и обеденные столы, столы с полками и табуреты",
          "Хранение — кухонные шкафы, ящики и прикроватные тумбочки",
          "Техника — холодильники, духовки, микроволновки и тостеры",
          "Декор — зеркала, часы, глобусы, чайники и кухонные принадлежности",
          "Ванная — душевые, ванны, раковины, туалеты и полотенца",
          "Для улицы — жалюзи, будки для собак и лестницы"
        ],
        info: [
          "Название: Rustic Furniture",
          "Версия: Minecraft Bedrock",
          "Тип: Addon",
          "Категория: Мебель"
        ],
        file: BASE_URL + "kurczak.mcaddon?download=1"
      }
    ];

    const STORAGE_KEY = "minecraft_saved_mods";

    let activeCategory = "all";
    let searchText = "";
    let savedMods = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    const modsList = document.getElementById("modsList");
    const savedList = document.getElementById("savedList");
    const savedCount = document.getElementById("savedCount");
    const categories = document.getElementById("categories");
    const searchInput = document.getElementById("searchInput");

    function isSaved(id) {
      return savedMods.includes(id);
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(savedMods));
    }

    function updateSavedCount() {
      savedCount.textContent = savedMods.length;
    }

    function getVisibleMods() {
      const query = searchText.trim().toLowerCase();

      return mods.filter((mod) => {
        const matchCategory =
          activeCategory === "all"
            ? true
            : mod.categories.includes(activeCategory);

        const haystack = [
          mod.name,
          mod.text,
          ...(mod.items || []),
          ...(mod.info || []),
          ...(mod.categories || [])
        ]
          .join(" ")
          .toLowerCase();

        const matchSearch =
          query === "" || haystack.includes(query);

        return matchCategory && matchSearch;
      });
    }

    function createCard(mod) {
      const saved = isSaved(mod.id);

      return `
        <article class="card" data-id="${mod.id}">
          <div class="image">
            <img src="${mod.image}" alt="${mod.name}">
            <div class="overlay"></div>
            <div class="badge">MINECRAFT BEDROCK</div>
          </div>

          <div class="info">
            <h2>${mod.name}</h2>
            <p>${mod.text}</p>

            <div class="actions">
              <span class="open" data-open="${mod.id}">Открыть описание →</span>
              <button class="save ${saved ? "saved" : ""}" data-save="${mod.id}" type="button">
                ${saved ? "✓ Сохранено" : "♡ Сохранить"}
              </button>
            </div>
          </div>
        </article>
      `;
    }

    function bindEvents(container) {
      container.querySelectorAll("[data-open]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();

          const mod = mods.find((item) => item.id === button.dataset.open);
          if (mod) openDetails(mod);
        });
      });

      container.querySelectorAll("[data-save]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleSaved(button.dataset.save);
        });
      });

      container.querySelectorAll(".card").forEach((cardEl) => {
        cardEl.addEventListener("click", (event) => {
          if (event.target.closest(".save")) return;

          const mod = mods.find((item) => item.id === cardEl.dataset.id);
          if (mod) openDetails(mod);
        });
      });
    }

    function renderMods() {
      const visibleMods = getVisibleMods();

      if (visibleMods.length === 0) {
        modsList.innerHTML = `
          <div class="empty">
            Ничего не найдено.<br>
            Попробуй изменить поиск или категорию.
          </div>
        `;
        return;
      }

      modsList.innerHTML = visibleMods.map(createCard).join("");
      bindEvents(modsList);
    }

    function renderSavedMods() {
      const filteredSaved = mods.filter((mod) => isSaved(mod.id));

      if (filteredSaved.length === 0) {
        savedList.inner
