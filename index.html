<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minecraft Mods</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(0, 255, 120, 0.13),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(0, 180, 255, 0.12),
                    transparent 30%
                ),
                #070909;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.08;
            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.15) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.15) 1px,
                    transparent 1px
                );
            background-size: 40px 40px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 18px;
            text-align: center;
            background: rgba(8, 10, 10, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .logo {
            font-size: 27px;
            font-weight: 900;
        }

        .logo span {
            color: #42e66c;
        }

        .hero {
            padding: 45px 20px 30px;
            text-align: center;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(35px, 9vw, 65px);
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(
                135deg,
                #ffffff,
                #8cffaa,
                #35e96c
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero p {
            max-width: 600px;
            margin: 18px auto 0;
            color: #929a96;
            font-size: 16px;
        }

        .container {
            width: min(900px, calc(100% - 30px));
            margin: 0 auto;
            padding-bottom: 60px;
        }

        .mods {
            display: grid;
            gap: 25px;
        }

        .mod-card {
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 26px;
            background: rgba(22, 27, 25, 0.88);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
            cursor: pointer;
            transition:
                transform 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .mod-card:hover {
            border-color: rgba(65, 235, 108, 0.4);
            box-shadow:
                0 30px 90px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(50, 220, 100, 0.08);
            transform: translateY(-7px);
        }

        .mod-card:active {
            transform: scale(0.98);
        }

        .image-wrapper {
            position: relative;
            overflow: hidden;
        }

        .mod-card-image {
            display: block;
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .mod-card:hover .mod-card-image {
            transform: scale(1.045);
        }

        .image-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                to top,
                rgba(5, 8, 7, 0.9),
                transparent 55%
            );
        }

        .badge {
            position: absolute;
            top: 18px;
            left: 18px;
            padding: 8px 13px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            background: rgba(20, 25, 22, 0.82);
            font-size: 13px;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }

        .mod-info {
            padding: 22px;
        }

        .mod-info h2 {
            margin: 0 0 10px;
            font-size: 25px;
        }

        .mod-info p {
            margin: 0;
            color: #929a96;
            line-height: 1.6;
        }

        .open-text {
            margin-top: 20px;
            color: #55ee79;
            font-weight: bold;
        }

        .footer {
            padding: 30px 20px 50px;
            color: #4f5753;
            text-align: center;
            font-size: 13px;
        }

        /* ОКНО ОПИСАНИЯ */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            overflow-y: auto;
            padding: 20px 0 50px;
            background: rgba(4, 6, 6, 0.98);
        }

        .modal.active {
            display: block;
        }

        .modal-content {
            width: min(850px, calc(100% - 30px));
            margin: 0 auto;
        }

        .close {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            margin-left: auto;
            border: 0;
            border-radius: 50%;
            background: #202523;
            color: white;
            font-size: 25px;
            cursor: pointer;
            transition: 0.25s;
        }

        .close:hover {
            background: #35d965;
            color: #071009;
            transform: rotate(90deg);
        }

        .modal-image {
            display: block;
            width: 100%;
            max-height: 500px;
            margin-top: 15px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            object-fit: cover;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        }

        .description {
            padding: 28px 5px;
        }

        .description h2 {
            margin: 0 0 15px;
            font-size: clamp(30px, 7vw, 45px);
            font-weight: 900;
        }

        .description p {
            color: #aeb5b1;
            font-size: 16px;
            line-height: 1.7;
        }

        .items-title {
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 22px;
            font-weight: 900;
        }

        .items {
            display: grid;
            gap: 10px;
        }

        .item {
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.035);
            color: #d7ddd9;
            line-height: 1.4;
        }

        .info-box {
            margin-top: 25px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.035);
            line-height: 1.8;
        }

        .info-title {
            margin-bottom: 8px;
            color: #52e873;
            font-weight: bold;
        }

        .download {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 18px;
            border-radius: 17px;
            background: linear-gradient(
                135deg,
                #36dc65,
                #20b94d
            );
            color: #061009;
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: 900;
            transition: 0.25s;
        }

        .download:hover {
            background: #55ee79;
            transform: translateY(-3px);
        }

        .note {
            margin-top: 12px;
            color: #626a66;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .hero {
                padding: 35px 15px 25px;
            }

            .container {
                width: calc(100% - 20px);
            }

            .mod-card-image {
                height: 240px;
            }
