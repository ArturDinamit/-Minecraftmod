<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Mods</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding-bottom:90px;
  min-height:100vh;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 20% 10%,rgba(0,255,120,.14),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(0,180,255,.14),transparent 30%),
    #070909
}

body.lock{overflow:hidden}

.header{
  position:sticky;
  top:0;
  z-index:10;
  padding:18px;
  text-align:center;
  background:rgba(8,10,10,.88);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(18px)
}

.logo{
  font-size:27px;
  font-weight:900
}

.logo span{color:#42e66c}

.hero{
  padding:45px 20px 25px;
  text-align:center
}

.hero h1{
  margin:0;
  font-size:clamp(35px,9vw,65px);
  line-height:1;
  background:linear-gradient(135deg,#fff,#8cffaa,#35e96c);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

.hero p{
  max-width:700px;
  margin:18px auto;
  color:#929a96;
  line-height:1.6
}

.categories{
  width:min(1100px,calc(100% - 30px));
  margin:0 auto 25px;
  padding:10px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  background:rgba(8,10,10,.6);
  backdrop-filter:blur(18px)
}

.category{
  flex:0 0 auto;
  border:0;
  border-radius:11px;
  padding:11px 17px;
  background:transparent;
  color:#aebbb2;
  font-weight:bold;
  cursor:pointer;
  white-space:nowrap
}

.category:hover,
.category.active{
  background:rgba(66,230,108,.16);
  color:#7cff99
}

.container{
  width:min(900px,calc(100% - 30px));
  margin:auto
}

.mods{
  display:grid;
  gap:25px
}

.card{
  overflow:hidden;
  border:1px solid rgba(255,255,255,.08);
  border-radius:26px;
  background:rgba(22,27,25,.92);
  box-shadow:0 25px 80px rgba(0,0,0,.45);
  cursor:pointer;
  transition:.3s
}

.card:hover{
  transform:translateY(-7px);
  border-color:rgba(65,235,108,.45)
}

.image{
  position:relative;
  height:300px;
  overflow:hidden
}

.image img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover
}

.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(5,8,7,.9),transparent 55%)
}

.badge{
  position:absolute;
  top:18px;
  left:18px;
  padding:8px 13px;
  border-radius:999px;
  background:rgba(20,25,22,.86);
  border:1px solid rgba(255,255,255,.15);
  font-size:13px;
  font-weight:bold
}

.info{
  padding:22px
}

.info h2{
  margin:0 0 10px;
  font-size:25px
}

.info p{
  margin:0;
  color:#929a96;
  line-height:1.6
}

.actions{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:20px
}

.open{
  color:#55ee79;
  font-weight:bold
}

.save{
  border:1px solid rgba(66,230,108,.4);
  border-radius:12px;
  padding:10px 14px;
  background:rgba(66,230,108,.1);
  color:#8cffaa;
  font-weight:bold;
  cursor:pointer
}

.save.saved{
  background:#42e66c;
  color:#071009
}

.empty{
  padding:40px 20px;
  border:1px dashed rgba(255,255,255,.18);
  border-radius:20px;
  color:#929a96;
  text-align:center;
  line-height:1.7
}

.footer{
  padding:30px 20px;
  color:#4f5753;
  text-align:center;
  font-size:13px
}

.bottom{
  position:fixed;
  right:0;
  bottom:0;
  left:0;
  z-index:100;
  height:74px;
  padding:9px 15px;
  border-top:1px solid rgba(255,255,255,.12);
  background:rgba(8,10,10,.76);
  backdrop-filter:blur(20px)
}

.bottom-inner{
  width:min(900px,100%);
  height:100%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.tab{
  min-width:140px;
  border:0;
  border-radius:14px;
  padding:11px 18px;
  background:transparent;
  color:#aebbb2;
  font-weight:bold;
  cursor:pointer
}

.tab:hover,
.tab.active{
  background:rgba(66,230,108,.15);
  color:#7cff99
}

.count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:22px;
  margin-left:5px;
  padding:0 6px;
  border-radius:999px;
  background:#42e66c;
  color:#071009;
  font-size:11px
}

.modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  overflow:auto;
  padding:20px 0 50px;
  background:rgba(4,6,6,.98)
}

.modal.active{display:block}

.modal-content{
  width:min(850px,calc(100% - 30px));
  margin:auto
}

.close{
  display:flex;
  align-items:center;
  justify-content:center;
  width:48px;
  height:48px;
  margin-left:auto;
  border:0;
  border-radius:50%;
  background:#202523;
  color:#fff;
  font-size:25px;
  cursor:pointer
}

.modal-image{
  display:block;
  width:100%;
  max-height:500px;
  margin-top:15px;
  border-radius:25px;
  object-fit:cover
}

.description{
  padding:25px 5px
}

.description h2{
  margin:0 0 15px;
  font-size:clamp(30px,7vw,45px)
}

.description p{
  color:#aeb5b1;
  line-height:1.7
}

.title{
  margin:25px 0 12px;
  font-size:22px;
  font-weight:bold
}

.items{
  display:grid;
  gap:10px
}

.item{
  padding:14px;
  border-radius:14px;
  background:rgba(255,255,255,.05);
  color:#d7ddd9
}

.info-box{
  margin-top:25px;
  padding:18px;
  border-radius:18px;
  background:rgba(255,255,255,.05);
  line-height:1.8
}

.info-title{
  margin-bottom:8px;
  color:#52e873;
  font-weight:bold
}

.download{
  display:block;
  width:100%;
  margin-top:25px;
  padding:18px;
  border-radius:17px;
  background:linear-gradient(135deg,#36dc65,#20b94d);
  color:#061009;
  text-align:center;
  text-decoration:none;
  font-size:18px;
  font-weight:900
}

@media(max-width:600px){
  .image{height:240px}
  .container{width:calc(100% - 20px)}
  .actions{
    align-items:stretch;
    flex-direction:column
  }
  .save{width:100%}
  .tab{
    min-width:0;
    padding:10px 12px;
    font-size:13px
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Minecraft <span>Mods</span></div>
</header>

<section class="hero">
  <h1>Моды Minecraft</h1>
  <p>Выбирай категорию, открывай описание, сохраняй понравившиеся и скачивай моды.</p>
</section>

<div id="categories" class="categories">
  <button class="category active" data-category="all">Все</button>
  <button class="category" data-category="cars">Машины</button>
  <button class="category" data-category="furniture">Мебель</button>
  <button class="category" data-category="mobs">Мобы</button>
  <button class="category" data-category="weapons">Оружие</button>
  <button class="category" data-category="items">Предметы</button>
  <button class="category" data-category="features">Новые возможности</button>
  <button class="category" data-category="other">Другие</button>
</div>

<main class="container">
  <div id="modsList" class="mods"></div>
</main>

<footer class="footer">
  Minecraft Mods • Bedrock Edition
</footer>

<nav class="bottom">
  <div class="bottom-inner">
    <button id="modsTab" class="tab active" type="button">Моды</button>

    <button id="savedTab" class="tab" type="button">
      Сохраненные
      <span id="savedCount" class="count">0</span>
    </button>
  </div>
</nav>

<div id="detailsModal" class="modal">
  <div class="modal-content">
    <button class="close" data-close="detailsModal">×</button>

    <img id="detailsImage" class="modal-image" alt="">

    <div class="description">
      <h2 id="detailsTitle"></h2>
      <p id="detailsText"></p>

      <div id="detailsItems"></div>
      <div id="detailsInfo" class="info-box"></div>

      <a id="detailsDownload" class="download" href="#" download>
        ↓ Скачать мод
      </a>
    </div>
  </div>
</div>

<div id="savedModal" class="modal">
  <div class="modal-content">
    <button class="close" data-close="savedModal">×</button>

    <div class="description">
      <h2>Сохраненные моды</h2>
      <p>Здесь находятся моды, которые ты сохранил.</p>

      <div id="savedList" class="mods"></div>
    </div>
  </div>
</div>

  {
