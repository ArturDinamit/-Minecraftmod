<div id="savedModal" class="modal">
    <div class="modal-content">
        <button class="close-button" data-close="savedModal">×</button>

        <div class="description">
            <h2>Сохраненные моды</h2>
            <p>Здесь находятся моды, которые ты сохранил.</p>

            <div id="savedModsList" class="mods"></div>
        </div>
    </div>
</div>

<script>
    const BASE_URL =
        "https.com/ArturDinamit/-Minecraftmod/main/";

    const mods = [
        {
истолет",
                "Пистолет-пулемёт",
                "Двуствольный обрез",
                "Разные характеристики боя",
                "Разные типы боеприпасов"
            ],
            info: [
                "Название: TR’s Simple Guns",
                "Версия: Minecraft Bedrock",
                "Тип: Addon",
                "Боеприпасы: разные типы"
            ],
            download: BASE_URL + "guns.mcpack"
        },

        {
            id: "lada",
            name: "Лада Веста",
            image: BASE_URL + "Lada.jpg",
            description:
                "Собственная русская машина в Minecraft с открывающимися двер и багажником.",
           ски Такси и ДПС",
                "Открываются все двери, капот и багажник",
                "4 посадочных места",
                "Заводится с ключа",
                "Есть коробка передач",
                "Спидометр",
                "Коллизия",
                "Требуется бензин",
                "Есть музыка"
            ],
            info: [
                "Название: Лада Веста",
                "Версия: Minecraft Bedrock",
                "Тип: Addon",
                "Стиль: Автомобиль / транспорт"
            ],
            download: BASE_URL + "Lada.mcaddon?download= document.getElementById("savedModsList");
    const savedCounter = document.getElementById("savedCounter");

    function isSaved(modId) {
        return savedMods.includes(modId);
    }

    function updateSavedCounter() {
        savedCounter.textContent = savedMods.length;
    }

    function saveData() {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(savedMods)
        );
    }

    function createModCard(mod) {
        const saved = isSaved(mod.id);

        return `
            <article class="mod-card" data-mod-id="${mod.id}">
                <div class="image-wrapper">
                    <img
                        class="mod-card-image"
                        src="${mod.image}"
                        alt="${mod.name}"
                    >

                    <div class="image-overlay"></div>

                    <div class="badge">
                        MINECRAFT BEDROCK
                    </div>
                </div>

                <div class="mod-info">
                    <h2>${mod.name}</h2>

                    <p>${mod.description}</p>

                    <div class="card-actions">
                        <span class="open-text" data-open-mod="${mod.id}">
                            Открыть описание →
                        </span>

                        <button
                            class="save-button ${saved ? "saved" : ""}"
                            type="button"
                            data-save-mod="${mod.id}"
                        >
                            ${saved ? "✓ Сохранено" : "♡ Сохранить"}
                        </button>
                    </div>
                </div>
            </article>
        `;
    }

    function renderMods() {
        modsList.innerHTML = mods
            .map(createModCard)
            .join("");

        addCardEvents(modsList);
    }

    function renderSavedMods() {
        const saved = mods.filter(mod => isSaved(mod.id));

        if (saved.length === 0) {
            savedModsList.innerHTML = `
                <div class="empty-message">
                    Пока нет сохраненных модов.<br>
                    Нажми «Сохранить» на карточке мода.
                </div>
            `;
            return;
        }

        savedModsList.innerHTML = saved
            .map(createModCard)
            .join("");

        addCardEvents(savedModsList);
    }

    function addCardEvents(container) {
        container
            .querySelectorAll("[data-open-mod]")
            .forEach(button => {
                button.addEventListener("click", function(event) {
                    event.stopPropagation();

                    const mod = mods.find(
                        item => item.id === this.dataset.openMod
                    );

                    openDetails(mod);
                });
            });

        container
            .querySelectorAll("[data-save-mod]")
            .forEach(button => {
                button.addEventListener("click", function(event) {
                    event.stopPropagation();

                    toggleSaved(this.dataset.saveMod);
                });
            });

        container
            .querySelectorAll(".mod-card")
            .forEach(card => {
                card.addEventListener("click", function(event) {
                    if (event.target.closest(".save-button")) {
                        return;
                    }

                    const mod = mods.find(
                        item => item.id === this.dataset.modId
                    );

                    openDetails(mod);
                });
            });
    }

    function toggleSaved(modId) {
        if (isSaved(modId)) {
            savedMods = savedMods.filter(id => id !== modId);
        } else {
            savedMods.push(modId);
        }

        saveData();
        updateSavedCounter();
        renderMods();
        renderSavedMods();
    }

    function openDetails(mod) {
        document.getElementById("detailsImage").src = mod.image;
        document.getElementById("detailsImage").alt = mod.name;

        document.getElementById("detailsTitle").textContent = mod.name;
        document.getElementById("detailsDescription").textContent =
            mod.description;

        document.getElementById("detailsFeatures").innerHTML = `
            <div class="items-title">Функции</div>

            <div class="items">
                ${mod.features
                    .map(feature => `<div class="item">${feature}</div>`)
                    .join("")}
            </div>
        `;

        document.getElementById("detailsInfo").innerHTML = `
            <div class="info-title">Информация</div>

            ${mod.info
                .map(info => `<div>${info}</div>`)
                .join("")}
        `;

        const download = document.getElementById("detailsDownload");

        download.href = mod.download;
        download.download = mod.download
            .split("/")
            .pop()
            .split("?")[0];

        openModal("detailsModal");
    }

    function openModal(id) {
        document.getElementById(id).classList.add("active");
        document.body.classList.add("modal-open");
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove("active");

        if (
            !document.querySelector(".modal.active")
        ) {
            document.body.classList.remove("modal-open");
        }
    }

    function closeAllModals() {
        document
            .querySelectorAll(".modal")
            .forEach(modal => modal.classList.remove("active"));

        document.body.classList.remove("modal-open");
    }

    document.getElementById("modsTab").addEventListener("click", function() {
        this.classList.add("active");
        document.getElementById("savedTab").classList.remove("active");
        closeModal("savedModal");
    });

    document.getElementById("savedTab").addEventListener("click", function() {
        this.classList.add("active");
        document.getElementById("modsTab").classList.remove("active");

        renderSavedMods();
        openModal("savedModal");
    });

    document.querySelectorAll("[data-close]").forEach(button => {
        button.addEventListener("click", function() {
            closeModal(this.dataset.closeEach(modal => {
        modal.addEventListener("click", function(event) {
            if (event.target === modal) {
                closeModal(modal.id);
            }
        });
    });

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            closeAllModals();
        }
    });

    renderMods();
    updateSavedCounter();
</script>

</body>
</html>
